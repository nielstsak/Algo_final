# configs/config.yaml
# Version complète et corrigée avec indentation standard.

# -----------------------------------------------------------------------------
# Configuration Générale de l'Application
# -----------------------------------------------------------------------------
app:
  name: "Algo Trading Bot"
  version: "1.0.1"
  environment: "development" # "development", "production", ou "test"

# -----------------------------------------------------------------------------
# Configuration de l'API Binance
# -----------------------------------------------------------------------------
# Charger les clés API depuis un fichier .env ou les variables d'environnement
# en utilisant les variables BINANCE_API_KEY et BINANCE_API_SECRET.
binance:
  testnet: false # true pour le Testnet, false pour le trading réel.

# -----------------------------------------------------------------------------
# Configuration de la Base de Données
# -----------------------------------------------------------------------------
database:
  db_type: "postgresql" # "postgresql" ou "sqlite".

  # Pour SQLite
  sqlite_path: "data/algobot_main.db"

  # Pour PostgreSQL (charger depuis l'environnement)
  # pg_host: "localhost"
  # pg_port: 5432
  # pg_user: "your_user"
  # pg_password: "your_password"
  # pg_db: "algobot_db"

  # Paramètres SQLAlchemy
  echo: false
  pool_size: 7
  max_overflow: 12
  pool_timeout: 30
  pool_recycle: 1800
  echo_pool: false
  pool_pre_ping: true

# -----------------------------------------------------------------------------
# Configuration des Données
# -----------------------------------------------------------------------------
data:
  storage_type: "parquet" # "parquet" ou "postgres".
  storage_path: "data/crypto_klines_processed"
  parquet_partition_cols:
    - "pair"
    - "year"
    - "month"
  cache_enabled: true
  cache_ttl: 3600 # 1 heure

# -----------------------------------------------------------------------------
# Configuration du Trading
# -----------------------------------------------------------------------------
trading:
  mode: "cross_margin" # "spot", "margin", "cross_margin", "isolated_margin".
  base_currency: "USDC"
  # --- POINT CRUCIAL ---
  # Cette liste doit contenir toutes les paires que le bot est autorisé à utiliser.
  allowed_pairs:
    - "WIF/USDC"
    - "HBAR/USDC"
    - "BTC/USDT"
    - "ETH/USDT"

# -----------------------------------------------------------------------------
# Configuration de la Gestion des Risques
# -----------------------------------------------------------------------------
risk:
  max_position_pct: 0.05      # 5% du capital par position
  max_drawdown_pct: 0.20      # 20% de drawdown total
  daily_loss_limit_pct: 0.10  # 10% de perte journalière

# -----------------------------------------------------------------------------
# Configuration du Monitoring et du Logging
# -----------------------------------------------------------------------------
monitoring:
  prometheus_enabled: false
  prometheus_port: 9091

  # Charger depuis l'environnement via ALERT_WEBHOOK_URL
  alert_webhook_url: null

  log_level_console: "INFO"
  log_level_file: "DEBUG"
  log_to_file_enabled: true
  log_file_path: "logs/algobot_runtime.log"
  log_rotation: "100 MB"
  log_retention: "10 days"
  log_compression: "gz"

# -----------------------------------------------------------------------------
# Configuration de Redis (Optionnel)
# -----------------------------------------------------------------------------
# Charger les identifiants depuis l'environnement si nécessaire.
redis:
  host: "localhost"
  port: 6379
  db: 0
